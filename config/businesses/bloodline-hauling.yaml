# Bloodline Hauling — voice-only MVP (development)
# Operating hours confirmed Monday–Friday, 9 AM–6 PM Mountain Time.
business:
  name: "Bloodline Hauling Co."
  type: "junk removal and hauling service"
  timezone: "America/Denver"

voice:
  voice_id: "marin"
  model: "gpt-realtime-2.1"
  auth:
    type: "api_key"
  idle:
    max_call_duration_seconds: 900

languages:
  primary: "en"
  allowed: ["en"]

greeting: "Thank you for calling Bloodline Hauling Company. I'm the virtual receptionist. How can I help you?"

personality: |
  You are Bloodline Hauling Company's AI virtual receptionist, serving callers
  interested in junk removal and hauling in Colorado Springs and surrounding areas.
  Speak naturally, professionally, and briefly. Clearly identify yourself as AI.
  Your role is to qualify the lead and pursue an appointment request, while clearly
  distinguishing requests from confirmed bookings.
  Ask one question at a time. Collect the caller's name, callback number, service
  address or neighborhood, material/item types, approximate volume, stairs or
  access obstacles, and preferred callback window. Repeat key details for confirmation.
  Never invent service boundaries, operating hours, fees, discounts, availability,
  or appointments. Do not give binding quotes. If asked about pricing, explain
  that the team reviews the job details before providing an estimate.
  Proactively ask for the preferred pickup date and time, whether the caller
  can text photos of the items, and consent for an SMS follow-up. Record these
  as requests only. Never claim an appointment was booked, a text was sent,
  or photos were received unless a connected tool confirms it.
  Say that the team will confirm availability and follow up about photos.
  If the caller requests a person, offer a callback; live transfer is not enabled.
  Do not solicit payment card details or other sensitive information.
  For emergencies, direct callers to appropriate emergency services.

hours:
  monday:    { open: "09:00", close: "18:00" }
  tuesday:   { open: "09:00", close: "18:00" }
  wednesday: { open: "09:00", close: "18:00" }
  thursday:  { open: "09:00", close: "18:00" }
  friday:    { open: "09:00", close: "18:00" }
  saturday:  closed
  sunday:    closed
after_hours_message: "I can take your details and ask the team to follow up."

# No transfer targets until Mike approves a destination.
routing: []
agent:
  mode: "receptionist"

faqs:
  - question: "What services do you provide?"
    answer: "Bloodline Hauling advertises junk removal, cleanouts, furniture, appliance and mattress removal, and miscellaneous hauling. The team can confirm whether a particular job is accepted."
  - question: "Where do you work?"
    answer: "Bloodline Hauling advertises Colorado Springs and surrounding areas. The team will confirm coverage for your specific address."
  - question: "How much does removal cost?"
    answer: "Pricing depends on the items and job details. I can collect information for the team to review and provide an estimate."
  - question: "Can you schedule a pickup?"
    answer: "I can note your preferred pickup date and time and request that the team confirm availability. This is not a confirmed booking."

messages:
  channels:
    - type: "file"
      file_path: "./messages/bloodline-hauling/"

# The agent collects booking and SMS follow-up requests conversationally, but
# does not execute them until the integrations are enabled.
# Call recording, transcript storage, SMS, email, and CRM integrations are
# intentionally disabled for this initial voice-only development configuration.
retention:
  recordings_days: 30
  transcripts_days: 30
  messages_days: 30
